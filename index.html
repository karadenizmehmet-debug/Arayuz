<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="Mehmet Karadeniz, 2026-2027">
<meta name="copyright" content="© Mehmet Karadeniz, 2026-2027. Tüm hakları saklıdır.">
<meta name="theme-color" content="#0f1a22">
<title>Karadeniz Ekosistemi</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=14">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=14">
<link rel="manifest" href="manifest.webmanifest?v=14">
<meta name="apple-mobile-web-app-title" content="Ekosistemim">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Düzen: Android ana ekranı gibi. Üstte arama hapı, altında hayalet açıklamasız uygulama simgeleri (squircle + altında ad). */
:root {
  color-scheme: light;
  --wall-a: #cfe4ee; --wall-b: #e6dcf2;
  --fg: #13202a;
  --muted: #4d6172;
  --pill: rgba(255,255,255,.72);
  --pill-line: rgba(19,32,42,.12);
  --accent: #0a6c8b;
  --ic-l1: 0.66; --ic-l2: 0.5; --ic-c: 0.16;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --wall-a: #0c1a24; --wall-b: #1d1f3d;
    --fg: #e9f0f5; --muted: #a3b3c0;
    --pill: rgba(255,255,255,.09); --pill-line: rgba(255,255,255,.14);
    --accent: #5cc3dd;
    --ic-l1: 0.7; --ic-l2: 0.52;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --wall-a: #0c1a24; --wall-b: #1d1f3d;
  --fg: #e9f0f5; --muted: #a3b3c0;
  --pill: rgba(255,255,255,.09); --pill-line: rgba(255,255,255,.14);
  --accent: #5cc3dd;
  --ic-l1: 0.7; --ic-l2: 0.52;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; min-height: 100%; background: var(--wall-a); }
body {
  margin: 0; min-height: 100vh; color: var(--fg);
  background: linear-gradient(160deg, var(--wall-a), var(--wall-b)) fixed;
  font-family: var(--font-body); font-size: 15px; line-height: 1.4;
}
.wrap {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(28px, env(safe-area-inset-top, 0px)) max(28px, env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 26px;
}
header { text-align: center; display: flex; flex-direction: column; gap: 4px; padding-top: 8px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(30px, 7vw, 44px); line-height: 1.05; margin: 0; letter-spacing: -.02em; }
.ver {
  display: inline-block; vertical-align: middle; margin-left: 6px; padding: 3px 9px;
  font-family: var(--font-body); font-size: 12px; font-weight: 600; letter-spacing: .02em; line-height: 1.3;
  color: var(--fg); background: var(--pill); border: 1px solid var(--pill-line); border-radius: 999px;
}
.sub { margin: 0; color: var(--muted); font-size: 14px; }
.hello {
  display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center;
  padding: 18px 16px; background: var(--pill); border: 1px solid var(--pill-line); border-radius: 28px;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
.hello-title { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(22px, 5.5vw, 30px); letter-spacing: -.01em; line-height: 1.15; }
.clock { font-family: var(--font-display); font-weight: 700; font-size: clamp(44px, 13vw, 64px); line-height: 1.05; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.date { color: var(--muted); font-size: 14px; }
.weather { margin-top: 6px; display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; min-height: 24px; }
.weather svg { width: 24px; height: 24px; color: var(--accent); flex: none; }
.weather .w-meta { color: var(--muted); font-weight: 400; font-size: 13px; }
.search {
  position: relative; display: flex; align-items: center;
  background: var(--pill); border: 1px solid var(--pill-line); border-radius: 999px;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
.search svg { position: absolute; left: 18px; width: 20px; height: 20px; color: var(--muted); pointer-events: none; }
.search input {
  width: 100%; min-width: 0; font: inherit; font-size: 16px; color: var(--fg); background: transparent;
  border: 0; border-radius: 999px; padding: 14px 18px 14px 50px;
}
.search input::placeholder { color: var(--muted); }
.tools { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.chip {
  font: inherit; font-size: 13px; color: var(--fg); cursor: pointer; min-height: 38px; padding: 7px 14px;
  background: var(--pill); border: 1px solid var(--pill-line); border-radius: 999px;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
.chip[aria-pressed="true"] { background: var(--fg); color: var(--wall-a); border-color: var(--fg); }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.apps {
  display: grid; gap: 26px 8px; justify-items: center; align-items: start;
  grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
}
.app {
  --c1: oklch(var(--ic-l1) var(--ic-c) var(--hue));
  --c2: oklch(var(--ic-l2) var(--ic-c) calc(var(--hue) + 18));
  width: 100%; max-width: 112px; min-width: 0;
  display: flex; flex-direction: column; align-items: center; gap: 9px;
  text-decoration: none; color: var(--fg); -webkit-tap-highlight-color: transparent;
}
.glyph {
  position: relative; width: 68px; height: 68px; border-radius: 24px; display: grid; place-items: center; color: #fff;
  background: linear-gradient(150deg, var(--c1), var(--c2));
  box-shadow: 0 8px 18px -6px color-mix(in oklab, var(--c2) 70%, transparent), inset 0 1px 0 rgba(255,255,255,.35);
}
.glyph svg { width: 34px; height: 34px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.18)); }
.badge {
  position: absolute; right: -5px; bottom: -5px; width: 24px; height: 24px; border-radius: 50%;
  display: none; place-items: center; background: var(--fg); color: var(--wall-a); border: 2px solid var(--wall-a);
}
.badge svg { width: 13px; height: 13px; filter: none; }
.code-mode .badge { display: grid; }
.label { font-size: 13px; font-weight: 500; text-align: center; line-height: 1.2; max-width: 100%; overflow-wrap: anywhere; text-wrap: balance; }
.app:hover .glyph { filter: brightness(1.06); }
.empty { color: var(--muted); text-align: center; padding: 20px 0; grid-column: 1 / -1; }
footer { text-align: center; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
@media (min-width: 640px) {
  .apps { grid-template-columns: repeat(auto-fill, minmax(116px, 1fr)); gap: 34px 12px; }
  .glyph { width: 76px; height: 76px; border-radius: 27px; }
  .glyph svg { width: 38px; height: 38px; }
  .app { max-width: 128px; }
}
@media (prefers-reduced-motion: no-preference) {
  .glyph { transition: transform .16s ease, filter .16s ease; }
  .app:hover .glyph { transform: translateY(-3px) scale(1.04); }
  .app:active .glyph { transform: scale(.94); }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Karadeniz Ekosistemi <span class="ver" id="ver"></span></h1>
    <p class="sub" id="sub">Bir simgeye dokun, uygulama açılsın.</p>
  </header>

  <section class="hello" aria-label="Karşılama">
    <p class="hello-title">Hoş geldin Mehmet</p>
    <div class="clock" id="clock" aria-live="off">--:--</div>
    <div class="date" id="date"></div>
    <div class="weather" id="weather"><span class="w-meta">Hava durumu yükleniyor…</span></div>
  </section>

  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Uygulama ara" aria-label="Uygulama ara" autocomplete="off">
  </div>

  <div class="tools" role="group" aria-label="Filtre">
    <button class="chip" type="button" data-f="all" aria-pressed="true">Tümü</button>
    <button class="chip" type="button" data-f="Okul" aria-pressed="false">Okul</button>
    <button class="chip" type="button" data-f="Ders" aria-pressed="false">Ders</button>
    <button class="chip" type="button" data-f="Kişisel" aria-pressed="false">Kişisel</button>
    <button class="chip" type="button" id="codeBtn" aria-pressed="false">Kaynak kodu</button>
  </div>

  <main id="out" class="apps"></main>

  <footer>
    <span>github.com/karadenizmehmet-debug</span>
    <span>© Mehmet Karadeniz, 2026-2027</span>
    <span>Tüm hakları saklıdır.</span>
  </footer>
</div>

<script>
(function () {
  var VERSION = "2.3"; // her değişiklikte artır: 2.3, 2.4 ...
  if ("serviceWorker" in navigator) { try { navigator.serviceWorker.register("sw.js").catch(function () {}); } catch (e) {} }
  document.getElementById("ver").textContent = "v" + VERSION;
  var U = "https://karadenizmehmet-debug.github.io/";
  var G = "https://github.com/karadenizmehmet-debug/";

  var ICONS = {
    pano: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4M7 9h5M7 12h8"/>',
    panel: '<rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/><path d="M12 15v2"/>',
    zil: '<path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7Z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
    bayrak: '<path d="M5 21V4"/><path d="M5 5h12l-2.5 4L17 13H5"/>',
    takip: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="m9 13 2 2 4-4"/>',
    kitap: '<path d="M3 5.5A1.5 1.5 0 0 1 4.5 4H11v15H4.5A1.5 1.5 0 0 0 3 20.5Z"/><path d="M21 5.5A1.5 1.5 0 0 0 19.5 4H13v15h6.5a1.5 1.5 0 0 1 1.5 1.5Z"/>',
    kod: '<path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"/>',
    nefes: '<path d="M3 8h10a3 3 0 1 0-3-3"/><path d="M3 12h15a3 3 0 1 1-3 3"/><path d="M3 16h7"/>',
    aile: '<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14.2A5 5 0 0 1 21 19"/>',
    resim: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5L7 20"/>',
    mebbis: '<path d="M3 10 12 4l9 6"/><path d="M5 10v9M9.5 10v9M14.5 10v9M19 10v9M3 20h18"/>'
  };
  function svg(inner, w) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (w || 1.8) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + inner + '</svg>'; }
  var CODE = svg('<path d="m8 8-4 4 4 4M16 8l4 4-4 4"/>', 2.4);

  var items = [
    { name: "Dijital Pano", cat: "Okul", hue: 235, icon: "pano", open: U + "digitalpano/", repo: "digitalpano", tip: "Okul panosu" },
    { name: "Pano Paneli", cat: "Okul", hue: 262, icon: "panel", open: U + "digitalpano/#/panel", repo: "digitalpano", tip: "Pano yönetim paneli (giriş ister)" },
    { name: "oZil Kumanda", cat: "Okul", hue: 60, icon: "zil", open: U + "Ozil/kumanda.html", repo: "Ozil", tip: "Okul zili uzaktan kumanda" },
    { name: "İstiklal Marşı", cat: "Okul", hue: 25, icon: "bayrak", open: U + "Zilfar/", repo: "Zilfar", tip: "Marşı uzaktan çalan panel" },
    { name: "Yegitek Takip", cat: "Okul", hue: 195, icon: "takip", open: U + "Yegitek/", repo: "Yegitek", tip: "Okul sorumlusu takip uygulaması" },
    { name: "MEBBİS", cat: "Okul", hue: 215, icon: "mebbis", open: "https://mebbis.meb.gov.tr/", tip: "MEB bilgi sistemi (giriş ister)" },
    { name: "Ders Rotası 6", cat: "Ders", hue: 150, icon: "kitap", open: U + "Emiko-okul/", repo: "Emiko-okul", tip: "6. sınıf konu anlatımı ve istasyonlar" },
    { name: "BTY Ders", cat: "Ders", hue: 295, icon: "kod", open: U + "Bty-ders/", repo: "Bty-ders", tip: "Bilişim ve Yapay Zekâ yazılı hazırlık" },
    { name: "Nefes", cat: "Kişisel", hue: 178, icon: "nefes", open: U + "Quitcigaret/", repo: "Quitcigaret", tip: "Sigara bırakma takibi" },
    { name: "Aile Takip", cat: "Kişisel", hue: 8, icon: "aile", open: U + "takip/takip.html", repo: "takip", tip: "Aile takip paneli (giriş ister)" },
    { name: "e-Okul Fotoğraf", cat: "Okul", hue: 330, icon: "resim", open: U + "Bgremover/", repo: "Bgremover", tip: "Fotoğrafların arka planını toplu siler" }
  ];

  var out = document.getElementById("out");
  var q = document.getElementById("q");
  var sub = document.getElementById("sub");
  var codeBtn = document.getElementById("codeBtn");
  var chips = Array.prototype.slice.call(document.querySelectorAll(".chip[data-f]"));
  var filter = "all", codeMode = false;
  try {
    var s = localStorage.getItem("genel-arayuz-kategori");
    if (s && ["Okul", "Ders", "Kişisel"].indexOf(s) !== -1) filter = s;
    codeMode = localStorage.getItem("genel-arayuz-kod") === "1";
  } catch (e) {}

  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text) n.textContent = text; return n; }
  function app(p) {
    var a = el("a", "app");
    var showCode = codeMode && !!p.repo; // deposu olmayan (dış site) simge her zaman sitesini açar
    a.href = showCode ? G + p.repo : p.open;
    a.target = "_blank"; a.rel = "noopener noreferrer";
    a.title = p.tip + (showCode ? " (kaynak kodu)" : "");
    a.style.setProperty("--hue", p.hue);
    var g = el("span", "glyph");
    g.innerHTML = svg(ICONS[p.icon]);
    if (p.repo) { var b = el("span", "badge"); b.innerHTML = CODE; g.appendChild(b); }
    a.appendChild(g);
    a.appendChild(el("span", "label", p.name));
    return a;
  }
  function render() {
    var term = q.value.trim().toLowerCase();
    out.textContent = "";
    var n = 0;
    items.forEach(function (p) {
      if (filter !== "all" && p.cat !== filter) return;
      if (term && (p.name + " " + p.tip + " " + p.cat).toLowerCase().indexOf(term) === -1) return;
      out.appendChild(app(p)); n++;
    });
    if (!n) out.appendChild(el("p", "empty", "Eşleşen uygulama yok."));
    chips.forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-f") === filter)); });
    codeBtn.setAttribute("aria-pressed", String(codeMode));
    out.classList.toggle("code-mode", codeMode);
    sub.textContent = codeMode ? "Kaynak kodu açık: simgeler GitHub'a gider." : "Bir simgeye dokun, uygulama açılsın.";
  }
  chips.forEach(function (b) {
    b.addEventListener("click", function () {
      filter = b.getAttribute("data-f");
      try { localStorage.setItem("genel-arayuz-kategori", filter); } catch (e) {}
      render();
    });
  });
  codeBtn.addEventListener("click", function () {
    codeMode = !codeMode;
    try { localStorage.setItem("genel-arayuz-kod", codeMode ? "1" : "0"); } catch (e) {}
    render();
  });
  q.addEventListener("input", render);
  render();

  // Karşılama: saat, tarih, hava durumu (Akşehir, Open-Meteo, anahtarsız)
  var clockEl = document.getElementById("clock");
  var dateEl = document.getElementById("date");
  var weatherEl = document.getElementById("weather");
  var TIME_FMT = new Intl.DateTimeFormat("tr-TR", { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false, timeZone: "Europe/Istanbul" });
  var DATE_FMT = new Intl.DateTimeFormat("tr-TR", { day: "numeric", month: "long", year: "numeric", weekday: "long", timeZone: "Europe/Istanbul" });
  function tick() {
    var now = new Date();
    clockEl.textContent = TIME_FMT.format(now);
    dateEl.textContent = DATE_FMT.format(now);
  }
  tick();
  setInterval(tick, 1000);

  var WMO = {
    0: ["Açık", "sun"], 1: ["Çoğunlukla açık", "sun"], 2: ["Parçalı bulutlu", "cloudsun"], 3: ["Kapalı", "cloud"],
    45: ["Sisli", "cloud"], 48: ["Kırağılı sis", "cloud"],
    51: ["Çiseleme", "rain"], 53: ["Çiseleme", "rain"], 55: ["Yoğun çiseleme", "rain"],
    61: ["Yağmurlu", "rain"], 63: ["Yağmurlu", "rain"], 65: ["Şiddetli yağmur", "rain"],
    66: ["Dondurucu yağmur", "rain"], 67: ["Dondurucu yağmur", "rain"],
    71: ["Kar yağışlı", "snow"], 73: ["Kar yağışlı", "snow"], 75: ["Yoğun kar", "snow"], 77: ["Kar taneleri", "snow"],
    80: ["Sağanak", "rain"], 81: ["Sağanak", "rain"], 82: ["Şiddetli sağanak", "rain"],
    85: ["Kar sağanağı", "snow"], 86: ["Kar sağanağı", "snow"],
    95: ["Gök gürültülü fırtına", "storm"], 96: ["Dolu ve fırtına", "storm"], 99: ["Dolu ve fırtına", "storm"]
  };
  var WICON = {
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    cloudsun: '<path d="M7 18a4 4 0 0 1-.5-7.97A5.5 5.5 0 0 1 17 9a4.5 4.5 0 0 1 .5 9Z"/><path d="M5 5.5 6.2 6.7M3 11H1.5"/>',
    cloud: '<path d="M7 18a4 4 0 0 1-.5-7.97A5.5 5.5 0 0 1 17 9a4.5 4.5 0 0 1 .5 9Z"/>',
    rain: '<path d="M7 15a4 4 0 0 1-.5-7.97A5.5 5.5 0 0 1 17 6a4.5 4.5 0 0 1 .5 9"/><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/>',
    snow: '<path d="M7 15a4 4 0 0 1-.5-7.97A5.5 5.5 0 0 1 17 6a4.5 4.5 0 0 1 .5 9"/><path d="M8 19h.01M12 19h.01M16 19h.01M10 21h.01M14 21h.01"/>',
    storm: '<path d="M7 14a4 4 0 0 1-.5-7.97A5.5 5.5 0 0 1 17 5a4.5 4.5 0 0 1 .5 9"/><path d="m12 13-2 4h3l-2 4"/>'
  };
  function showWeather(w) {
    var info = WMO[w.code] || ["Hava durumu", "cloud"];
    weatherEl.textContent = "";
    var ic = document.createElement("span");
    ic.innerHTML = svg(WICON[info[1]] || WICON.cloud);
    weatherEl.appendChild(ic.firstChild);
    weatherEl.appendChild(document.createTextNode("Akşehir " + Math.round(w.temp) + "°C, " + info[0] + " "));
    var meta = el("span", "w-meta", "· Hissedilen " + Math.round(w.feels) + "°C · Rüzgâr " + Math.round(w.wind) + " km/sa");
    weatherEl.appendChild(meta);
  }
  function loadWeather() {
    var url = "https://api.open-meteo.com/v1/forecast?latitude=38.356&longitude=31.416" +
      "&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&timezone=Europe%2FIstanbul";
    fetch(url).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (d) {
      var c = d.current;
      var w = { temp: c.temperature_2m, feels: c.apparent_temperature, code: c.weather_code, wind: c.wind_speed_10m };
      showWeather(w);
      try { localStorage.setItem("genel-arayuz-hava", JSON.stringify(w)); } catch (e) {}
    }).catch(function () {
      var cached = null;
      try { cached = JSON.parse(localStorage.getItem("genel-arayuz-hava")); } catch (e) {}
      if (cached) showWeather(cached);
      else weatherEl.innerHTML = '<span class="w-meta">Hava durumu alınamadı.</span>';
    });
  }
  loadWeather();
  setInterval(loadWeather, 15 * 60 * 1000);
})();
</script>
</body>
</html>
